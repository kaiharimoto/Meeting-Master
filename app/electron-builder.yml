# electron-builder configuration for the Windows installer build.
# Fonts and the print template are shipped as extraResources (NOT inside the
# asar) so src/main/paths.js can resolve them via process.resourcesPath.
appId: com.kaiharimoto.meeting-master
productName: MeetingMaster
directories:
  output: dist
files:
  - "src/**/*"
  - "package.json"
  # Runtime tray/window icon (main.js appIconPath). buildResources content is
  # NOT packaged by default, so without this line packaged builds have no tray
  # — and server mode without a tray is invisible and unquittable.
  - "build/icon.png"
extraResources:
  - from: assets/fonts
    to: fonts
  - from: src/renderer/print
    to: print
  # The bundled Python home server (PyInstaller onedir). CI drops the built
  # MeetingMasterServer tree into app/sidecar/ before running electron-builder;
  # in a dev checkout the folder only holds a README (server mode then falls
  # back to the repo's python — see src/main/serverManager.js).
  - from: sidecar
    to: server
win:
  target: nsis
  # Generated from assets/icon/icon.svg by scripts/build-icons.js (committed).
  icon: build/icon.ico
# Auto-update metadata: having a publish config makes electron-builder emit
# dist/latest.yml (version + installer sha512), which CI attaches to the
# GitHub Release and the HOME SERVER re-serves at /updates/laptop/ for
# electron-updater. The URL here is a build-time placeholder — the app sets
# the real feed (its configured server URL) at runtime in src/main/updater.js.
# The dist script passes --publish never, so nothing is ever uploaded from a
# build machine.
publish:
  - provider: generic
    url: "http://127.0.0.1:8080/updates/laptop"
# A normal double-click installer (no admin, per-user) — not a portable exe.
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: "Meeting Master"
  artifactName: "MeetingMaster-Setup-${version}.exe"
# Retained so `electron-builder --win portable` (npm run dist:portable) works.
portable:
  artifactName: "MeetingMaster-portable-${version}.exe"
