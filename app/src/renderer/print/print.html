<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Meeting Notes</title>
  <link rel="stylesheet" href="print.css" />
</head>
<body>
  <section id="details">
    <div class="topbar">
      <span class="topbar-label">Meeting Notes</span>
      <span class="topbar-tag">Internal</span>
    </div>
    <div class="heavy-rule"></div>
    <h1 id="detail-title"></h1>
    <div class="detail-band" id="detail-band"></div>
  </section>

  <section id="qa">
    <h2 class="section-header">Q&amp;A<span id="qa-count" class="section-count"></span></h2>
    <div class="section-rule"></div>
    <div id="qa-cards"></div>
  </section>

  <section id="summary">
    <h2 class="summary-header">Meeting Summary</h2>
    <div class="summary-rule"></div>
    <div id="summary-body"></div>
    <div class="colophon">
      <span class="colophon-title" id="colophon-title"></span>
      <span class="colophon-date" id="colophon-date"></span>
    </div>
  </section>

  <script>
    // Called by src/main/pdf.js via executeJavaScript (and by the Playwright
    // print test). Everything goes through textContent / createElement so the
    // meeting data is never interpreted as HTML.

    var MONTHS = ['January', 'February', 'March', 'April', 'May', 'June',
      'July', 'August', 'September', 'October', 'November', 'December'];

    // "2026-07-16" -> "July 16, 2026". Parsed by hand (never via new Date on
    // the string) so the rendered date can't shift a day across timezones.
    function formatDate(iso) {
      var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(iso || '');
      if (!m) return iso || '';
      var month = MONTHS[parseInt(m[2], 10) - 1];
      if (!month) return iso;
      return month + ' ' + parseInt(m[3], 10) + ', ' + m[1];
    }

    // "2026-07-16" -> "July 2026" (for the colophon).
    function formatMonthYear(iso) {
      var m = /^(\d{4})-(\d{2})-\d{2}$/.exec(iso || '');
      if (!m) return '';
      var month = MONTHS[parseInt(m[2], 10) - 1];
      return month ? month + ' ' + m[1] : '';
    }

    // "14:30" -> "2:30 PM"; anything unparseable passes through untouched.
    function formatTime(hhmm) {
      var m = /^(\d{1,2}):(\d{2})$/.exec(hhmm || '');
      if (!m) return hhmm || '';
      var hours = parseInt(m[1], 10);
      if (hours > 23) return hhmm;
      var suffix = hours >= 12 ? 'PM' : 'AM';
      var twelve = hours % 12 === 0 ? 12 : hours % 12;
      return twelve + ':' + m[2] + ' ' + suffix;
    }

    function cleanStrings(list) {
      if (!Array.isArray(list)) return [];
      return list
        .map(function (s) { return typeof s === 'string' ? s.trim() : ''; })
        .filter(Boolean);
    }

    // Build one titled summary section (heading + a <ul>/<ol> of items). The
    // caller supplies a per-item builder so takeaways, follow-ups, and topics
    // can each carry their own marker treatment. Returns null when empty.
    function buildSummarySection(heading, cssClass, items, listTag, buildItem) {
      if (items.length === 0) return null;
      var section = document.createElement('div');
      section.className = 'sum-section ' + cssClass;

      var head = document.createElement('div');
      head.className = 'sum-heading';
      head.textContent = heading;
      section.appendChild(head);

      var list = document.createElement(listTag);
      list.className = 'sum-list';
      items.forEach(function (text, i) {
        list.appendChild(buildItem(text, i));
      });
      section.appendChild(list);
      return section;
    }

    // Render data.summary, which is either the new structured object
    // {keyTakeaways, followUps, topics} or (legacy/mock) a plain string.
    function renderSummary(host, summary) {
      host.textContent = '';

      // Legacy: a plain-prose string renders as two-column paragraphs.
      if (typeof summary === 'string') {
        var text = summary.trim();
        if (!text) return renderSummaryPlaceholder(host);
        host.classList.add('is-prose');
        var paras = text.split(/\n\s*\n/).map(function (p) { return p.trim(); })
          .filter(Boolean);
        paras.forEach(function (para, i) {
          var p = document.createElement('p');
          p.textContent = para;
          if (paras.length % 2 === 1 && i === paras.length - 1) p.className = 'span-all';
          host.appendChild(p);
        });
        return;
      }

      host.classList.remove('is-prose');
      summary = summary || {};
      var takeaways = cleanStrings(summary.keyTakeaways);
      var followUps = cleanStrings(summary.followUps);
      var topics = cleanStrings(summary.topics);

      if (takeaways.length === 0 && followUps.length === 0 && topics.length === 0) {
        return renderSummaryPlaceholder(host);
      }

      // Key Takeaways — full-width hero list with big accent index numbers.
      var key = buildSummarySection(
        'Key Takeaways', 'sum-key', takeaways, 'ol',
        function (text, i) {
          var li = document.createElement('li');
          li.className = 'takeaway';
          var num = document.createElement('span');
          num.className = 'takeaway-num';
          num.textContent = (i + 1 < 10 ? '0' : '') + (i + 1);
          var body = document.createElement('span');
          body.className = 'takeaway-text';
          body.textContent = text;
          li.appendChild(num);
          li.appendChild(body);
          return li;
        }
      );
      if (key) host.appendChild(key);

      // Follow-Up Points + Topics Discussed — a two-column lower band.
      var lower = document.createElement('div');
      lower.className = 'sum-lower';

      var follow = buildSummarySection(
        'Follow-Up Points', 'sum-followups', followUps, 'ul',
        function (text) {
          var li = document.createElement('li');
          li.className = 'followup';
          var body = document.createElement('span');
          body.className = 'followup-text';
          body.textContent = text;
          li.appendChild(body);
          return li;
        }
      );
      if (follow) lower.appendChild(follow);

      var topicSection = buildSummarySection(
        'Topics Discussed', 'sum-topics', topics, 'ul',
        function (text) {
          var li = document.createElement('li');
          li.className = 'topic-chip';
          li.textContent = text;
          return li;
        }
      );
      if (topicSection) lower.appendChild(topicSection);

      if (lower.childNodes.length) host.appendChild(lower);
    }

    function renderSummaryPlaceholder(host) {
      var placeholder = document.createElement('p');
      placeholder.className = 'placeholder span-all';
      placeholder.textContent = '(No AI summary was generated for this meeting)';
      host.appendChild(placeholder);
    }

    window.renderMeeting = function renderMeeting(data) {
      data = data || {};
      var details = data.details || {};

      // ---- Masthead + details band ----
      var title = details.title || 'Untitled meeting';
      document.title = 'Meeting Notes — ' + title;
      document.getElementById('detail-title').textContent = title;

      var band = document.getElementById('detail-band');
      band.textContent = '';
      var attendees = Array.isArray(details.attendees)
        ? details.attendees.filter(Boolean)
        : [];
      [
        ['Date', formatDate(details.date) || '—'],
        ['Time', formatTime(details.time) || '—'],
        ['In attendance', attendees.length ? attendees.join(', ') : '—'],
      ].forEach(function (pair) {
        var cell = document.createElement('div');
        cell.className = 'detail-cell';
        var lab = document.createElement('div');
        lab.className = 'detail-label';
        lab.textContent = pair[0];
        var val = document.createElement('div');
        val.className = 'detail-value';
        val.textContent = pair[1];
        cell.appendChild(lab);
        cell.appendChild(val);
        band.appendChild(cell);
      });

      // ---- Q&A table (Q index | question | answer + attribution) ----
      var cardsHost = document.getElementById('qa-cards');
      cardsHost.textContent = '';
      var cards = Array.isArray(data.cards) ? data.cards : [];
      document.getElementById('qa-count').textContent = cards.length
        ? String(cards.length)
        : '';

      if (cards.length === 0) {
        var noCards = document.createElement('p');
        noCards.className = 'placeholder';
        noCards.textContent = '(No questions were captured for this meeting)';
        cardsHost.appendChild(noCards);
      }

      cards.forEach(function (card, index) {
        var el = document.createElement('article');
        el.className = 'qa-card';

        var marker = document.createElement('div');
        marker.className = 'q-index';
        marker.textContent = 'Q' + (index + 1);
        el.appendChild(marker);

        var q = document.createElement('div');
        q.className = 'question';
        q.textContent = card.question || '';
        el.appendChild(q);

        var right = document.createElement('div');
        right.className = 'q-right';
        var a = document.createElement('div');
        a.className = 'answer';
        a.textContent = card.answer || '';
        right.appendChild(a);
        if (card.participant) {
          var who = document.createElement('div');
          who.className = 'participant-chip';
          who.textContent = card.participant;
          right.appendChild(who);
        }
        el.appendChild(right);

        cardsHost.appendChild(el);
      });

      // ---- Summary (structured presentation-style sections) ----
      renderSummary(document.getElementById('summary-body'), data.summary);

      // ---- Colophon ----
      document.getElementById('colophon-title').textContent = title;
      document.getElementById('colophon-date').textContent =
        formatMonthYear(details.date);
    };
  </script>
</body>
</html>
