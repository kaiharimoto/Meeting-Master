<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Meeting Notes</title>
  <link rel="stylesheet" href="print.css" />
</head>
<body>
  <section id="details">
    <div class="topbar">
      <span class="topbar-label">Meeting Notes</span>
      <span class="topbar-tag">Internal</span>
    </div>
    <div class="heavy-rule"></div>
    <h1 id="detail-title"></h1>
    <div class="detail-band" id="detail-band"></div>
  </section>

  <section id="contents" hidden>
    <div class="contents-head">Contents</div>
    <div class="contents-rows" id="contents-rows"></div>
  </section>

  <section id="qa">
    <h2 class="section-header">Q&amp;A<span id="qa-count" class="section-count"></span></h2>
    <div class="section-rule"></div>
    <div id="qa-cards"></div>
  </section>

  <section id="summary">
    <h2 class="summary-header">Meeting Summary</h2>
    <div class="summary-rule"></div>
    <div id="summary-body"></div>
    <div class="colophon" id="summary-colophon">
      <span class="colophon-title" id="colophon-title"></span>
      <span class="colophon-date" id="colophon-date"></span>
    </div>
  </section>

  <!-- Opt-in appendix (off by default). The colophon closes whichever section
       ends the document, so exactly one of the two is ever shown. -->
  <section id="transcript" hidden>
    <h2 class="summary-header">Transcript</h2>
    <div class="transcript-rule"></div>
    <p class="transcript-note" id="transcript-note"></p>
    <div id="transcript-body"></div>
    <div class="colophon" id="transcript-colophon">
      <span class="colophon-title" id="colophon-title-2"></span>
      <span class="colophon-date" id="colophon-date-2"></span>
    </div>
  </section>

  <script>
    // Called by src/main/pdf.js via executeJavaScript (and by the Playwright
    // print test). Everything goes through textContent / createElement so the
    // meeting data is never interpreted as HTML.

    var MONTHS = ['January', 'February', 'March', 'April', 'May', 'June',
      'July', 'August', 'September', 'October', 'November', 'December'];

    // "2026-07-16" -> "July 16, 2026". Parsed by hand (never via new Date on
    // the string) so the rendered date can't shift a day across timezones.
    function formatDate(iso) {
      var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(iso || '');
      if (!m) return iso || '';
      var month = MONTHS[parseInt(m[2], 10) - 1];
      if (!month) return iso;
      return month + ' ' + parseInt(m[3], 10) + ', ' + m[1];
    }

    // "2026-07-16" -> "July 2026" (for the colophon).
    function formatMonthYear(iso) {
      var m = /^(\d{4})-(\d{2})-\d{2}$/.exec(iso || '');
      if (!m) return '';
      var month = MONTHS[parseInt(m[2], 10) - 1];
      return month ? month + ' ' + m[1] : '';
    }

    // "14:30" -> "2:30 PM"; anything unparseable passes through untouched.
    function formatTime(hhmm) {
      var m = /^(\d{1,2}):(\d{2})$/.exec(hhmm || '');
      if (!m) return hhmm || '';
      var hours = parseInt(m[1], 10);
      if (hours > 23) return hhmm;
      var suffix = hours >= 12 ? 'PM' : 'AM';
      var twelve = hours % 12 === 0 ? 12 : hours % 12;
      return twelve + ':' + m[2] + ' ' + suffix;
    }

    function cleanStrings(list) {
      if (!Array.isArray(list)) return [];
      return list
        .map(function (s) { return typeof s === 'string' ? s.trim() : ''; })
        .filter(Boolean);
    }

    // Normalize the actionItems array to clean {task, owner, due, priority}.
    function cleanActions(list) {
      if (!Array.isArray(list)) return [];
      var valid = { high: 1, normal: 1, low: 1 };
      return list
        .map(function (a) {
          if (!a || typeof a !== 'object') return null;
          var task = typeof a.task === 'string' ? a.task.trim() : '';
          if (!task) return null;
          var pri = String(a.priority || 'normal').toLowerCase();
          return {
            task: task,
            owner: typeof a.owner === 'string' ? a.owner.trim() : '',
            due: typeof a.due === 'string' ? a.due.trim() : '',
            priority: valid[pri] ? pri : 'normal',
          };
        })
        .filter(Boolean);
    }

    // Build one titled summary section (heading + a <ul>/<ol> of items). The
    // caller supplies a per-item builder so each section carries its own marker
    // treatment. Returns null when empty.
    function buildSummarySection(heading, cssClass, items, listTag, buildItem) {
      if (items.length === 0) return null;
      var section = document.createElement('div');
      section.className = 'sum-section ' + cssClass;

      var head = document.createElement('div');
      head.className = 'sum-heading';
      head.textContent = heading;
      section.appendChild(head);

      var list = document.createElement(listTag);
      list.className = 'sum-list';
      items.forEach(function (item, i) {
        list.appendChild(buildItem(item, i));
      });
      section.appendChild(list);
      return section;
    }

    // Action Items — a ruled table: priority dot | task | owner | due.
    function buildActionItems(actions) {
      var section = document.createElement('div');
      section.className = 'sum-section sum-actions';

      var head = document.createElement('div');
      head.className = 'sum-heading';
      head.textContent = 'Action Items';
      section.appendChild(head);

      var table = document.createElement('div');
      table.className = 'ai-table';

      var header = document.createElement('div');
      header.className = 'ai-row ai-head';
      ['', 'Task', 'Owner', 'Due'].forEach(function (label) {
        var c = document.createElement('span');
        c.textContent = label;
        header.appendChild(c);
      });
      table.appendChild(header);

      actions.forEach(function (a) {
        var row = document.createElement('div');
        row.className = 'ai-row';

        var dot = document.createElement('span');
        dot.className = 'ai-pri ai-pri-' + a.priority;
        dot.title = a.priority.charAt(0).toUpperCase() + a.priority.slice(1) + ' priority';
        row.appendChild(dot);

        var task = document.createElement('span');
        task.className = 'ai-task';
        task.textContent = a.task;
        row.appendChild(task);

        var owner = document.createElement('span');
        owner.className = 'ai-owner';
        owner.textContent = a.owner || '—';
        row.appendChild(owner);

        var due = document.createElement('span');
        due.className = 'ai-due';
        due.textContent = a.due || '—';
        row.appendChild(due);

        table.appendChild(row);
      });
      section.appendChild(table);

      // Legend so the priority dots are decodable on paper.
      var legend = document.createElement('div');
      legend.className = 'ai-legend';
      [['high', 'High'], ['normal', 'Normal'], ['low', 'Low']].forEach(function (p) {
        var item = document.createElement('span');
        item.className = 'ai-legend-item';
        var d = document.createElement('span');
        d.className = 'ai-pri ai-pri-' + p[0];
        var t = document.createElement('span');
        t.textContent = p[1];
        item.appendChild(d);
        item.appendChild(t);
        legend.appendChild(item);
      });
      section.appendChild(legend);
      return section;
    }

    // Render data.summary, either the structured object
    // {keyTakeaways, keyInsights, decisions, actionItems, keyFigures, topics}
    // or (legacy) a string.
    function renderSummary(host, summary) {
      host.textContent = '';

      // Legacy: a plain-prose string renders as two-column paragraphs.
      if (typeof summary === 'string') {
        var text = summary.trim();
        if (!text) return renderSummaryPlaceholder(host);
        host.classList.add('is-prose');
        var paras = text.split(/\n\s*\n/).map(function (p) { return p.trim(); })
          .filter(Boolean);
        paras.forEach(function (para, i) {
          var p = document.createElement('p');
          p.textContent = para;
          if (paras.length % 2 === 1 && i === paras.length - 1) p.className = 'span-all';
          host.appendChild(p);
        });
        return;
      }

      host.classList.remove('is-prose');
      summary = summary || {};
      var takeaways = cleanStrings(summary.keyTakeaways);
      var insights = cleanStrings(summary.keyInsights);
      var decisions = cleanStrings(summary.decisions);
      var actions = cleanActions(summary.actionItems);
      var figures = cleanStrings(summary.keyFigures);
      var topics = cleanStrings(summary.topics);

      if (!takeaways.length && !insights.length && !decisions.length &&
          !actions.length && !figures.length && !topics.length) {
        return renderSummaryPlaceholder(host);
      }

      // Key Takeaways — full-width hero list with big accent index numbers.
      var key = buildSummarySection(
        'Key Takeaways', 'sum-key', takeaways, 'ol',
        function (text, i) {
          var li = document.createElement('li');
          li.className = 'takeaway';
          var num = document.createElement('span');
          num.className = 'takeaway-num';
          num.textContent = (i + 1 < 10 ? '0' : '') + (i + 1);
          var body = document.createElement('span');
          body.className = 'takeaway-text';
          body.textContent = text;
          li.appendChild(num);
          li.appendChild(body);
          return li;
        }
      );
      if (key) host.appendChild(key);

      // Key Insights — arrow markers: lessons pointing FORWARD, out of this
      // meeting and into the next one. Deliberately distinct from Key
      // Takeaways above (what happened) and set in the same weight, since a
      // reader looking for "what do we do differently" comes here.
      var ins = buildSummarySection(
        'Key Insights', 'sum-insights', insights, 'ul',
        function (text) {
          var li = document.createElement('li');
          li.className = 'insight';
          var body = document.createElement('span');
          body.className = 'insight-text';
          body.textContent = text;
          li.appendChild(body);
          return li;
        }
      );
      if (ins) {
        var note = ins.querySelector('.sum-heading');
        // A one-line gloss on paper: nobody reading the PDF has seen the UI
        // copy that explains how insights differ from takeaways.
        var kicker = document.createElement('span');
        kicker.className = 'sum-heading-note';
        kicker.textContent = 'to apply going forward';
        note.appendChild(kicker);
        host.appendChild(ins);
      }

      // Decisions — filled accent markers (agreed = settled).
      var dec = buildSummarySection(
        'Decisions', 'sum-decisions', decisions, 'ul',
        function (text) {
          var li = document.createElement('li');
          li.className = 'decision';
          var body = document.createElement('span');
          body.className = 'decision-text';
          body.textContent = text;
          li.appendChild(body);
          return li;
        }
      );
      if (dec) host.appendChild(dec);

      // Action Items — ruled table with priority dots.
      if (actions.length) host.appendChild(buildActionItems(actions));

      // Key Figures + Topics Discussed — a two-column lower band.
      var lower = document.createElement('div');
      lower.className = 'sum-lower';

      var fig = buildSummarySection(
        'Key Figures', 'sum-figures', figures, 'ul',
        function (text) {
          var li = document.createElement('li');
          li.className = 'figure';
          var body = document.createElement('span');
          body.className = 'figure-text';
          body.textContent = text;
          li.appendChild(body);
          return li;
        }
      );
      if (fig) lower.appendChild(fig);

      var topicSection = buildSummarySection(
        'Topics Discussed', 'sum-topics', topics, 'ul',
        function (text) {
          var li = document.createElement('li');
          li.className = 'topic-chip';
          li.textContent = text;
          return li;
        }
      );
      if (topicSection) lower.appendChild(topicSection);

      if (lower.childNodes.length) host.appendChild(lower);
    }

    function renderSummaryPlaceholder(host) {
      var placeholder = document.createElement('p');
      placeholder.className = 'placeholder span-all';
      placeholder.textContent = '(No AI summary was generated for this meeting)';
      host.appendChild(placeholder);
    }

    // Contents index (page 1): section names + item counts, dot-leader style.
    // A quick map of what's inside; shown only when there are >= 2 sections.
    // "1:05" / "1:02:05" — mirrors renderer/js/timecode.js. Duplicated rather
    // than imported because this template runs in its own window with no
    // module loader; the app/test/unit/timecode.test.js format is the contract.
    function formatTimecode(seconds) {
      var value = Number(seconds);
      var total = isFinite(value) ? Math.max(0, Math.floor(value)) : 0;
      var hours = Math.floor(total / 3600);
      var minutes = Math.floor((total % 3600) / 60);
      var secs = String(total % 60);
      if (secs.length < 2) secs = '0' + secs;
      if (hours > 0) {
        var mm = String(minutes);
        if (mm.length < 2) mm = '0' + mm;
        return hours + ':' + mm + ':' + secs;
      }
      return minutes + ':' + secs;
    }

    // The opt-in appendix. Returns how many lines were rendered (0 = no
    // transcript asked for, or nothing usable in it) so the caller can decide
    // whether the section and its contents row exist at all.
    function renderTranscript(transcript) {
      var section = document.getElementById('transcript');
      var host = document.getElementById('transcript-body');
      var note = document.getElementById('transcript-note');
      host.textContent = '';
      if (!transcript) {
        section.hidden = true;
        return 0;
      }

      var segments = Array.isArray(transcript.segments) ? transcript.segments : [];
      var lines = [];
      segments.forEach(function (seg) {
        var text = seg && typeof seg.text === 'string' ? seg.text.trim() : '';
        // whisper emits empty segments for silence; a page of bare timestamps
        // helps nobody.
        if (text) lines.push({ at: formatTimecode(seg.start), text: text });
      });
      // A meeting from before segments were stored still has the flat text —
      // print it without timestamps rather than dropping the appendix.
      if (lines.length === 0 && transcript.text) {
        lines.push({ at: null, text: String(transcript.text) });
      }
      if (lines.length === 0) {
        section.hidden = true;
        return 0;
      }

      note.textContent =
        'Automatic transcription — times are offsets into the recording.';
      lines.forEach(function (line) {
        var row = document.createElement('div');
        row.className = 'transcript-line';
        if (line.at !== null) {
          var at = document.createElement('span');
          at.className = 'transcript-time';
          at.textContent = line.at;
          row.appendChild(at);
        }
        var body = document.createElement('span');
        body.className = 'transcript-text';
        body.textContent = line.text;
        row.appendChild(body);
        host.appendChild(row);
      });
      section.hidden = false;
      return lines.length;
    }

    function renderContents(cards, summary, transcriptLines) {
      var section = document.getElementById('contents');
      var rows = document.getElementById('contents-rows');
      rows.textContent = '';

      var entries = [['Questions & Answers', cards.length]];
      if (summary && typeof summary === 'object') {
        entries.push(['Key Takeaways', cleanStrings(summary.keyTakeaways).length]);
        entries.push(['Key Insights', cleanStrings(summary.keyInsights).length]);
        entries.push(['Decisions', cleanStrings(summary.decisions).length]);
        entries.push(['Action Items', cleanActions(summary.actionItems).length]);
        entries.push(['Key Figures', cleanStrings(summary.keyFigures).length]);
        entries.push(['Topics Discussed', cleanStrings(summary.topics).length]);
      } else if (typeof summary === 'string' && summary.trim()) {
        entries.push(['Meeting Summary', 1]);
      }
      if (transcriptLines > 0) entries.push(['Transcript', transcriptLines]);

      var present = entries.filter(function (e) { return e[1] > 0; });
      if (present.length < 2) {
        section.hidden = true;
        return;
      }

      present.forEach(function (e) {
        var row = document.createElement('div');
        row.className = 'toc-row';
        var name = document.createElement('span');
        name.className = 'toc-name';
        name.textContent = e[0];
        var dots = document.createElement('span');
        dots.className = 'toc-dots';
        var count = document.createElement('span');
        count.className = 'toc-count';
        count.textContent = String(e[1]);
        row.appendChild(name);
        row.appendChild(dots);
        row.appendChild(count);
        rows.appendChild(row);
      });
      section.hidden = false;
    }

    window.renderMeeting = function renderMeeting(data) {
      data = data || {};
      var details = data.details || {};

      // ---- Masthead + details band ----
      var title = details.title || 'Untitled meeting';
      document.title = 'Meeting Notes — ' + title;
      document.getElementById('detail-title').textContent = title;

      var band = document.getElementById('detail-band');
      band.textContent = '';
      var attendees = Array.isArray(details.attendees)
        ? details.attendees.filter(Boolean)
        : [];
      [
        ['Date', formatDate(details.date) || '—'],
        ['Time', formatTime(details.time) || '—'],
        ['In attendance', attendees.length ? attendees.join(', ') : '—'],
      ].forEach(function (pair) {
        var cell = document.createElement('div');
        cell.className = 'detail-cell';
        var lab = document.createElement('div');
        lab.className = 'detail-label';
        lab.textContent = pair[0];
        var val = document.createElement('div');
        val.className = 'detail-value';
        val.textContent = pair[1];
        cell.appendChild(lab);
        cell.appendChild(val);
        band.appendChild(cell);
      });

      // ---- Q&A table (Q index | question | answer + attribution) ----
      var cardsHost = document.getElementById('qa-cards');
      cardsHost.textContent = '';
      var cards = Array.isArray(data.cards) ? data.cards : [];
      document.getElementById('qa-count').textContent = cards.length
        ? String(cards.length)
        : '';

      if (cards.length === 0) {
        var noCards = document.createElement('p');
        noCards.className = 'placeholder';
        noCards.textContent = '(No questions were captured for this meeting)';
        cardsHost.appendChild(noCards);
      }

      cards.forEach(function (card, index) {
        var el = document.createElement('article');
        el.className = 'qa-card';

        var marker = document.createElement('div');
        marker.className = 'q-index';
        marker.textContent = 'Q' + (index + 1);
        el.appendChild(marker);

        var q = document.createElement('div');
        q.className = 'question';
        q.textContent = card.question || '';
        el.appendChild(q);

        var right = document.createElement('div');
        right.className = 'q-right';
        var a = document.createElement('div');
        a.className = 'answer';
        a.textContent = card.answer || '';
        right.appendChild(a);
        if (card.participant) {
          var who = document.createElement('div');
          who.className = 'participant-chip';
          who.textContent = card.participant;
          right.appendChild(who);
        }
        el.appendChild(right);

        cardsHost.appendChild(el);
      });

      // ---- Transcript appendix (opt-in; absent unless asked for) ----
      var transcriptLines = renderTranscript(data.transcript);

      // ---- Contents index (page 1) ----
      renderContents(cards, data.summary, transcriptLines);

      // ---- Summary (structured presentation-style sections) ----
      renderSummary(document.getElementById('summary-body'), data.summary);

      // ---- Colophon ----
      // It closes the document, so it belongs to whichever section is last.
      var hasTranscript = transcriptLines > 0;
      document.getElementById('summary-colophon').hidden = hasTranscript;
      document.getElementById('transcript-colophon').hidden = !hasTranscript;
      var monthYear = formatMonthYear(details.date);
      document.getElementById('colophon-title').textContent = title;
      document.getElementById('colophon-date').textContent = monthYear;
      document.getElementById('colophon-title-2').textContent = title;
      document.getElementById('colophon-date-2').textContent = monthYear;
    };
  </script>
</body>
</html>
